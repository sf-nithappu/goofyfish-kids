<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:#fde68a}canvas{display:block}</style>
<canvas id="c"></canvas>
<script src="../shared/core.js"></script>
<script>
// Renders the app icon: butter square, a cheering stick figure and a balloon. ?s=512
const S = Number(Q.get('s')) || 512;
cv.width = cv.height = S;
cv.style.width = cv.style.height = S + 'px';
ctx.fillStyle = '#fde68a';
ctx.fillRect(0, 0, S, S);
ctx.save();
ctx.translate(S * 0.5, S * 0.84);
const k = S / 330;
ctx.scale(k, k);
ctx.strokeStyle = COL.ink; ctx.lineWidth = 3;
ctx.beginPath(); ctx.moveTo(-100, 0); ctx.lineTo(100, 0); ctx.stroke();
drawFigure({ pose: P.cheer }, -20, 8, 0, { live: false, scale: 1.25, lw: 1.3 });
// balloon
ctx.save(); ctx.translate(75, -150);
ctx.beginPath(); ctx.moveTo(0, 62); ctx.bezierCurveTo(10, 90, -10, 110, 0, 140); ctx.stroke();
ctx.beginPath(); ctx.ellipse(0, 0, 44, 52, 0, 0, Math.PI * 2); inkShape('#ff8a80', 4);
ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 6; ctx.lineCap = 'round';
ctx.beginPath(); ctx.arc(0, 0, 32, Math.PI * 1.15, Math.PI * 1.4); ctx.stroke();
ctx.restore();
ctx.restore();
</script>
