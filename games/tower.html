<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Tower Crash</title>
<link rel="stylesheet" href="../shared/kid.css">
</head>
<body>
<canvas id="c"></canvas>
<script src="../shared/shell.js"></script>
<script src="../shared/core.js"></script>
<script>
// Tower Crash: tap to drop toy blocks onto a wobbly tower. Press and hold, then let go: the figure knocks it all down.
const me = new Actor(P.ready);
const TCX = 100, HOME_X = -130, MAX_H = 270;
let blocks = [], falling = [], junk = [];
let scroll = 0, sway = 0, swayV = 0, nextId = 1, count = 0, lastCol = -1;
let holdId = null, holdT = 0, winding = false, knocking = false;
let fx = HOME_X, fxTarget = HOME_X, idle = 0, botKnockIn = 0;

P.wind = mk({ head: [-8, -118], chest: [-6, -94], hip: [-3, -64], kF: [20, -38], hF: [-22, -112], eF: [-18, -92], hB: [-24, -98], eB: [-18, -84] });

const stackH = () => blocks.reduce((s, b) => s + b.h, 0);

function makeBlock() {
  let c;
  do {
    c = (Math.random() * PAL.length) | 0;
  } while (c === lastCol);
  lastCol = c;
  return { id: nextId++, w: 54 + Math.round(Math.random() * 58), h: 26 + Math.round(Math.random() * 20), col: PAL[c], ox: (Math.random() - 0.5) * 32, deco: nextId % 3 };
}

function dropBlock() {
  const R = screenRect();
  const b = makeBlock();
  b.fy = R.t - 60;
  b.vy = 120;
  falling.push(b);
  note(count++ % 8, 0.35, 0.15, 'sine');
  SND.whoosh();
}

function land(b) {
  falling.splice(falling.indexOf(b), 1);
  blocks.push(b);
  const top = -stackH() + scroll;
  swayV += (Math.random() < 0.5 ? -1 : 1) * (0.25 + Math.random() * 0.3);
  wobble.hit('tower', 5);
  wobble.hit(b.id, 6);
  SND.thunk(0.5);
  dust(TCX + b.ox, top + b.h, b.w, 3);
  confetti(TCX + b.ox, top, 4);
  if (blocks.length % 5 === 0 && !knocking && me.idle) {
    SND.cheer();
    me.push({ pose: P.cheer, d: 0.2, ez: 'out' }, { pose: P.leap, d: 0.22 }, { pose: P.cheer, d: 0.22 }, { pose: P.ready, d: 0.35 });
  }
}

function blockPos(i, bot) {
  const b = blocks[i];
  const cy = bot - b.h / 2;
  return { x: TCX + b.ox + sway * -cy + (winding ? Math.sin(clock * 55) * 2 : 0), y: cy, r: sway * 0.5 };
}

function doCrash() {
  let bot = scroll;
  const n = blocks.length;
  for (let i = 0; i < n; i++) {
    const b = blocks[i];
    bot -= 0;
    const p = blockPos(i, bot);
    const f = i / Math.max(1, n);
    junk.push({
      id: b.id, w: b.w, h: b.h, col: b.col, deco: b.deco, x: p.x, y: p.y, rot: p.r,
      vx: 90 + Math.random() * 300 + f * 120, vy: -(120 + Math.random() * 280) - f * 60, vr: (Math.random() - 0.3) * 12, t: 0, hits: 0,
    });
    bot -= b.h;
  }
  blocks = [];
  scroll = 0;
  sway = swayV = 0;
  SND.crash();
  setTimeout(() => SND.thunk(1), 160);
  setTimeout(() => SND.cheer(), 650);
  kick(110);
  wobble.hit('tower', 10);
  dust(TCX, 0, 130, 10);
  confetti(TCX, -90, 34);
  burst(TCX, -60, 10);
}

function knock() {
  if (knocking) {
    return;
  }
  knocking = true;
  fxTarget = -14;
  me.clear();
  me.push(
    { pose: P.leap, d: 0.16 },
    { pose: P.punch, d: 0.1, ez: 'in' },
    { fn: doCrash },
    { pose: P.punch, d: 0.15 },
    { pose: P.cheer, d: 0.25, ez: 'out' },
    { pose: P.leap, d: 0.25 },
    { pose: P.cheer, d: 0.25 },
    { pose: P.leap, d: 0.25 },
    { pose: P.cheer, d: 0.3 },
    { fn: () => {
      fxTarget = HOME_X;
      knocking = false;
      idle = 3.4;
    } },
    { pose: P.ready, d: 0.4 },
  );
}

function press(id) {
  idle = 0;
  dropBlock();
  if (holdId === null && !knocking) {
    holdId = id;
    holdT = 0;
    winding = false;
    me.clear();
    me.push({ pose: P.crouch, d: 0.5 });
  }
}
function release(id) {
  if (id !== holdId) {
    return;
  }
  holdId = null;
  if (winding) {
    winding = false;
    knock();
  } else if (!knocking) {
    me.clear();
    me.push({ pose: P.cheer, d: 0.12, ez: 'out' }, { pose: P.ready, d: 0.3 });
  }
}

function drawBlock(b, w, h) {
  roundRect(-w / 2, -h / 2, w, h, 6);
  inkShape(b.col, 2.6);
  ctx.strokeStyle = 'rgba(255,255,255,.75)';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  line(-w / 2 + 9, -h / 2 + 7, w / 2 - 14, -h / 2 + 7);
  ctx.strokeStyle = COL.ink;
  ctx.fillStyle = COL.ink;
  if (b.deco === 1) {
    ctx.lineWidth = 1.8;
    line(-w / 2 + 6, h / 6, w / 2 - 6, h / 6);
  } else if (b.deco === 2) {
    ctx.beginPath();
    ctx.arc(-w / 5, h / 8, 2.6, 0, 7);
    ctx.arc(w / 5, h / 8, 2.6, 0, 7);
    ctx.fill();
  }
}

kid({
  view: { x0: -300, x1: 300, y0: -440, y1: 40, minW: 440, focusX: 40 },
  setup() {
    for (let i = 0; i < 3; i++) {
      blocks.push(makeBlock());
    }
  },
  down(x, y, id) {
    press(id);
  },
  up(x, y, id) {
    release(id);
  },
  key(code, isDown) {
    if (isDown) {
      press('k' + code);
    } else {
      release('k' + code);
    }
    return true;
  },
  update(dt) {
    me.update(dt);
    fx += (fxTarget - fx) * Math.min(1, dt * (knocking ? 16 : 5));
    idle += dt;
    if (idle > 5 && !knocking && holdId === null) {
      idle = 3.2;
      dropBlock();
    }
    if (holdId !== null) {
      holdT += dt;
      if (!winding && holdT >= 0.6) {
        winding = true;
        me.clear();
        me.push({ pose: P.wind, d: 0.15, ez: 'out' });
        [0, 2, 4, 6].forEach((n, i) => partial(PENTA[n + 2], 0, 0.3, 0.1, 'triangle', 0.4, i * 0.05));
        sparkleBits();
      }
    }
    if (BOT && blocks.length >= 8 && !knocking) {
      botKnockIn += dt;
      if (botKnockIn > 0.8) {
        botKnockIn = 0;
        knock();
      }
    }
    // sway spring: the tower wobbles but always settles back
    swayV += (-70 * sway - 3.2 * swayV) * dt;
    sway += swayV * dt;
    sway = clamp(sway, -0.09, 0.09);
    // view scroll: the tower sinks into the ground when it gets tall
    const H = stackH();
    scroll += (Math.max(0, H - MAX_H) - scroll) * Math.min(1, dt * 3);
    while (blocks.length > 2 && blocks[0].h <= scroll - 4) {
      scroll -= blocks[0].h;
      blocks.shift();
    }
    for (const b of falling.slice()) {
      b.vy += 1500 * dt;
      b.fy += b.vy * dt;
      if (b.fy + b.h / 2 >= -stackH() + scroll - 0) {
        land(b);
      }
    }
    const R = screenRect();
    const wallR = Math.min(R.r, 560) - 8, wallL = Math.max(R.l, -560) + 8;
    for (let i = junk.length - 1; i >= 0; i--) {
      const j = junk[i];
      j.t += dt;
      j.vy += 1100 * dt;
      j.x += j.vx * dt;
      j.y += j.vy * dt;
      j.rot += j.vr * dt;
      const ext = Math.abs(Math.cos(j.rot)) * j.h / 2 + Math.abs(Math.sin(j.rot)) * j.w / 2;
      if (j.y + ext > 0) {
        j.y = -ext;
        if (j.vy > 160 && j.hits < 2) {
          dust(j.x, 0, j.w, 2);
          if (j.hits === 0 && Math.random() < 0.5) {
            SND.tok(0.7);
          }
        }
        j.hits++;
        j.vy = j.vy > 60 ? -j.vy * 0.32 : 0;
        j.vx *= 1 - Math.min(1, 4 * dt);
        j.vr *= 1 - Math.min(1, 5 * dt);
        if (Math.abs(j.vy) < 30) {
          const target = Math.round(j.rot / (Math.PI / 2)) * (Math.PI / 2);
          j.rot += (target - j.rot) * Math.min(1, dt * 9);
        }
      }
      if (j.x + j.w / 2 > wallR) {
        j.x = wallR - j.w / 2;
        j.vx = -Math.abs(j.vx) * 0.5;
      } else if (j.x - j.w / 2 < wallL) {
        j.x = wallL + j.w / 2;
        j.vx = Math.abs(j.vx) * 0.5;
      }
      if (j.t > 3.4) {
        junk.splice(i, 1);
      }
    }
  },
  draw(R) {
    groundLine();
    contactShadow(TCX, 70, 0.08);
    // tower, clipped at the ground so it sinks into it
    ctx.save();
    ctx.beginPath();
    ctx.rect(-4000, -4000, 8000, 4001.5);
    ctx.clip();
    const k = 1 + wobble.get('tower');
    ctx.translate(TCX, 0);
    ctx.scale(1 / k, k);
    ctx.translate(-TCX, 0);
    let bot = scroll;
    for (let i = 0; i < blocks.length; i++) {
      const b = blocks[i];
      const p = blockPos(i, bot);
      const bk = 1 + wobble.get(b.id);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.r);
      ctx.scale(1 / bk, bk);
      drawBlock(b, b.w, b.h);
      ctx.restore();
      bot -= b.h;
    }
    ctx.restore();
    for (const b of falling) {
      ctx.save();
      ctx.translate(TCX + b.ox, b.fy);
      drawBlock(b, b.w, b.h);
      ctx.restore();
    }
    for (const j of junk) {
      ctx.save();
      ctx.globalAlpha = j.t > 2.7 ? Math.max(0, 1 - (j.t - 2.7) / 0.7) : 1;
      ctx.translate(j.x, j.y);
      ctx.rotate(j.rot);
      drawBlock(j, j.w, j.h);
      ctx.restore();
    }
    // figure and the hold ring
    contactShadow(fx, 20, 0.1);
    const lift = winding ? 0 : 0;
    drawFigure(me, fx, 8, Math.sin(clock * 2) * 1.2, { scale: 1.1 });
    if (holdId !== null && !knocking) {
      const pr = Math.min(1, holdT / 0.6);
      const cx = fx, cy = -165;
      ctx.lineCap = 'round';
      ctx.strokeStyle = COL.faint;
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(cx, cy, 14, 0, Math.PI * 2);
      ctx.stroke();
      if (winding) {
        ctx.fillStyle = PAL[1];
        drawStar(cx, cy, 17 + Math.sin(clock * 20) * 3, clock * 4);
        inkShape(PAL[1], 2.4);
      } else {
        ctx.strokeStyle = COL.ink;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(cx, cy, 14, -Math.PI / 2, -Math.PI / 2 + pr * Math.PI * 2);
        ctx.stroke();
      }
    }
  },
});

function sparkleBits() {
  for (let i = 0; i < 10; i++) {
    const a = Math.random() * 6.28;
    bits.push({ x: fx, y: -90, vx: Math.cos(a) * 120, vy: Math.sin(a) * 120, r: 0, vr: 6, c: PAL[i % PAL.length], t: 0, life: 0.6, w: 6, h: 4, g: 0, drag: 3 });
  }
}
</script>
</body>
</html>
