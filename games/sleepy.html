<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Sleepy Time</title>
<link rel="stylesheet" href="../shared/kid.css">
</head>
<body>
<canvas id="c"></canvas>
<script src="../shared/shell.js"></script>
<script src="../shared/core.js"></script>
<script>
// Sleepy Time: tap anywhere (or the lamp) to turn the lights off. The paper fades to navy, stars twinkle in with soft
// chimes, the moon rises, the figure yawns and lies down while Zzz drift up. Tap again to wake him. Everything is slow and quiet.
// Local helper: mix(a, b, k) blends two #rrggbb colours (night palette).
const me = new Actor(P.ready);
const NAVY = '#0f1b3d', CHALK = '#dbe4ff';
const SC = 0.85;
let dark = false, darkK = 0, lieK = 0, lastToggle = -9, sched = [], zzz = [], zzzIn = 1, seq = 0, handsUp = 0;
const stars = Array.from({ length: 16 }, (_, i) => ({ u: (i * 0.618 + 0.07) % 1, v: ((i * 0.381 + 0.11) % 1), a: 0, ph: i * 1.7, on: false }));

function hex(c) {
  return [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
}
function mix(a, b, k) {
  const x = hex(a), y = hex(b);
  return '#' + x.map((v, i) => Math.round(lerp(v, y[i], k)).toString(16).padStart(2, '0')).join('');
}
const dim = (c, k) => mix(c, '#34447d', k * 0.7);

function later(t, fn) {
  sched.push({ t, fn });
}

function toggle() {
  if (clock - lastToggle < 0.8) {
    note(2, 0.6, 0.03, 'sine');
    return;
  }
  lastToggle = clock;
  dark = !dark;
  sched = [];
  wobble.hit('lamp', 4);
  me.clear();
  if (dark) {
    [7, 5, 3, 1].forEach((n, i) => setTimeout(() => note(n, 1.1, 0.045, 'sine'), i * 260));
    stars.forEach((s, i) => {
      s.on = false;
      later(1.0 + i * 0.32, () => {
        s.on = true;
        note(4 + ((i * 3) % 7), 1.4, 0.035, 'sine');
      });
    });
    me.push({ pose: P.cheer, d: 0.9 }, { pose: P.cheer, d: 0.8 }, { pose: P.phew, d: 0.9 }, { pose: P.stand, d: 0.8 });
    later(0.3, () => (handsUp = 1));
    later(2.6, () => (handsUp = 0));
    later(3.0, () => (seq = 1)); // lie down
  } else {
    [1, 3, 5, 7].forEach((n, i) => setTimeout(() => note(n, 1, 0.045, 'sine'), i * 200));
    stars.forEach((s) => (s.on = false));
    seq = 0;
    later(1.2, () => {
      me.clear();
      me.push({ pose: P.cheer, d: 1.0 }, { pose: P.cheer, d: 0.9 }, { pose: P.ready, d: 1.0 });
      note(9, 0.8, 0.05, 'sine');
    });
  }
}

kid({
  view: { x0: -300, x1: 300, y0: -440, y1: 40, minW: 440, focusX: 0 },
  down() {
    toggle();
    SND.tok(0.15);
  },
  update(dt) {
    me.update(dt);
    wobble.update(dt);
    for (let i = sched.length - 1; i >= 0; i--) {
      sched[i].t -= dt;
      if (sched[i].t <= 0) {
        const f = sched[i].fn;
        sched.splice(i, 1);
        f();
      }
    }
    darkK += ((dark ? 1 : 0) - darkK) * Math.min(1, dt * 1.1);
    lieK += ((seq ? 1 : 0) - lieK) * Math.min(1, dt * 1.3);
    for (const s of stars) {
      s.a += ((s.on ? 1 : 0) - s.a) * Math.min(1, dt * (s.on ? 1.5 : 3));
    }
    zzzIn -= dt;
    if (lieK > 0.95 && zzzIn <= 0) {
      zzzIn = 1.5;
      zzz.push({ x: -112, y: -62, t: 0, s: 0.8 + Math.random() * 0.3 });
    }
    for (let i = zzz.length - 1; i >= 0; i--) {
      zzz[i].t += dt;
      if (zzz[i].t > 4.5) {
        zzz.splice(i, 1);
      }
    }
  },
  draw(R) {
    const k = darkK;
    // night paper over the whole screen
    ctx.globalAlpha = clamp(k * 1.05, 0, 1);
    ctx.fillStyle = NAVY;
    ctx.fillRect(R.l - 60, R.t - 60, R.r - R.l + 120, R.b - R.t + 120);
    ctx.globalAlpha = 1;
    const ink = mix('#141414', CHALK, k);
    COL.ink = ink;
    COL.fig = ink;
    // stars and moon
    for (const s of stars) {
      if (s.a < 0.02) {
        continue;
      }
      const sxp = R.l + s.u * (R.r - R.l), syp = R.t + 30 + s.v * (-20 - R.t - 30);
      if (sxp - R.l < 1 && false) {
        continue;
      }
      if ((sxp - R.l) * cam.s < 120 && (syp - R.t) * cam.s < 120) {
        continue;
      }
      const tw = 1 + Math.sin(clock * 1.3 + s.ph) * 0.18;
      ctx.globalAlpha = s.a * (0.75 + 0.25 * Math.sin(clock * 1.1 + s.ph));
      drawStar(sxp, syp, 9 * s.a * tw, clock * 0.1);
      ctx.fillStyle = '#fff3b0';
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    const mk2 = clamp((k - 0.35) / 0.65, 0, 1);
    if (mk2 > 0.01) {
      const mx = Math.min(R.r - 70, 200), my = -355 + (1 - EASE.soft(mk2)) * 80;
      ctx.globalAlpha = mk2;
      ctx.beginPath();
      ctx.arc(mx, my, 30, 0, 7);
      inkShape('#fff3b0', 2.4);
      ctx.beginPath();
      ctx.arc(mx + 8, my + 6, 5, 0, 7);
      ctx.arc(mx - 9, my - 8, 3.5, 0, 7);
      ctx.fillStyle = 'rgba(180,150,60,.35)';
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    // ground
    drawGround(R.l - 20, R.r + 20);
    // house: a cutaway room with a roof
    const wall = dim('#fff1c2', k);
    ctx.beginPath();
    ctx.moveTo(-205, -250);
    ctx.lineTo(0, -365);
    ctx.lineTo(205, -250);
    ctx.closePath();
    inkShape(dim(PAL[0], k), 3);
    ctx.beginPath();
    roundRect(-175, -250, 350, 250, 6);
    inkShape(wall, 3);
    // window with sky, moon-ish glow and stars
    ctx.save();
    ctx.translate(-80, -175);
    ctx.beginPath();
    roundRect(-42, -42, 84, 84, 8);
    ctx.save();
    ctx.clip();
    ctx.fillStyle = mix('#cdeefe', '#16224a', k);
    ctx.fillRect(-44, -44, 88, 88);
    if (k < 0.7) {
      ctx.globalAlpha = 1 - k;
      ctx.fillStyle = '#fff';
      const cx = ((clock * 6) % 140) - 60;
      ctx.beginPath();
      ctx.ellipse(cx, -12, 18, 9, 0, 0, 7);
      ctx.ellipse(cx + 14, -16, 12, 8, 0, 0, 7);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    ctx.beginPath();
    roundRect(-42, -42, 84, 84, 8);
    ctx.lineWidth = 3.5;
    ctx.strokeStyle = ink;
    ctx.stroke();
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(0, -42);
    ctx.lineTo(0, 42);
    ctx.moveTo(-42, 0);
    ctx.lineTo(42, 0);
    ctx.stroke();
    for (const [sx, sy] of [[-22, -22], [20, 18], [-20, 22]]) {
      ctx.globalAlpha = darkK * 0.9;
      drawStar(sx, sy, 6 + Math.sin(clock + sx) * 1, 0);
      ctx.fillStyle = '#fff3b0';
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    // bed
    ctx.beginPath();
    roundRect(-160, -26, 190, 26, 8);
    inkShape(dim(PAL[3], k), 2.8);
    ctx.beginPath();
    roundRect(-158, -44, 46, 20, 10);
    inkShape(dim('#ffffff', k), 2.4);
    // lamp (the glow fades as the lights go out)
    const lk = 1 + wobble.get('lamp');
    ctx.save();
    ctx.translate(112, 0);
    ctx.scale(1 / lk, lk);
    ctx.lineWidth = 4;
    ctx.strokeStyle = ink;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, -120);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(0, -2, 24, 7, 0, 0, 7);
    inkShape(dim(PAL[4], k), 2.4);
    if (k < 0.95) {
      ctx.globalAlpha = (1 - k) * 0.28;
      ctx.beginPath();
      ctx.arc(0, -130, 62 + Math.sin(clock * 2) * 2, 0, 7);
      ctx.fillStyle = '#fcd34d';
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.beginPath();
    ctx.moveTo(-14, -118);
    ctx.lineTo(14, -118);
    ctx.lineTo(26, -152);
    ctx.lineTo(-26, -152);
    ctx.closePath();
    inkShape(mix('#ffe08a', '#4a4f7a', k), 2.8);
    ctx.restore();
    // figure
    const sleepy = lieK;
    const rot = -Math.PI / 2 * EASE.soft(clamp(sleepy, 0, 1));
    const fx = lerp(-12, -12, 0), fy = 8 * SC - 34 * EASE.soft(clamp(sleepy, 0, 1));
    const breath = Math.sin(clock * (sleepy > 0.9 ? 1.1 : 2)) * (sleepy > 0.9 ? 2 : 1.2);
    drawFigure(me, fx, fy, breath, {
      scale: SC,
      rot,
      ink,
      over(J) {
        // nightcap: a floppy cone in toy purple with a pompom and a white brim
        const [hx, hy] = J.head, r = J.hr;
        ctx.beginPath();
        ctx.moveTo(hx - r * 1.05, hy - r * 0.2);
        ctx.quadraticCurveTo(hx - r * 0.9, hy - r * 2.3, hx - r * 2.3, hy - r * 1.5);
        ctx.quadraticCurveTo(hx - r * 0.1, hy - r * 1.9, hx + r * 1.05, hy - r * 0.35);
        ctx.closePath();
        inkShape(dim(PAL[4], k), 1.8);
        ctx.beginPath();
        ctx.arc(hx - r * 2.3, hy - r * 1.5, r * 0.45, 0, 7);
        inkShape(dim('#ffffff', k), 1.6);
        ctx.beginPath();
        ctx.ellipse(hx, hy - r * 0.3, r * 1.2, r * 0.35, -0.12, 0, 7);
        inkShape(dim('#ffffff', k), 1.8);
      },
    });
    if (sleepy > 0.5) {
      // blanket over the legs and tummy
      ctx.globalAlpha = clamp((sleepy - 0.5) * 2, 0, 1);
      ctx.beginPath();
      roundRect(-72, -52, 100, 34, 10);
      inkShape(dim(PAL[1], k), 2.6);
      ctx.globalAlpha = 1;
    }
    // Zzz drifting up
    for (const z of zzz) {
      const u = z.t / 4.5;
      ctx.save();
      ctx.globalAlpha = Math.sin(Math.min(1, u) * Math.PI) * 0.9;
      ctx.translate(z.x + Math.sin(z.t * 1.2) * 8 + z.t * 8, z.y - z.t * 22);
      ctx.rotate(-0.15);
      ctx.font = `${Math.round((18 + u * 22) * z.s)}px 'Balsamiq Sans', 'Comic Sans MS', sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = CHALK;
      ctx.strokeStyle = ink;
      ctx.lineWidth = 3;
      ctx.strokeText('Z', 0, 0);
      ctx.fillText('Z', 0, 0);
      ctx.restore();
    }
    COL.ink = '#141414';
    COL.fig = '#141414';
  },
});
</script>
</body>
</html>
